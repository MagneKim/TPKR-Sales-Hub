<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPKR Sales Hub</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script> 

    <style>
        :root {
            --main-blue: rgb(0, 91, 172);
            --dark-grey: rgb(73, 73, 73);
            --white: #ffffff;
            --black: #000000;
            --light-grey: #f4f4f4;
        }

        body { font-family: 'Pretendard', sans-serif; margin: 0; background-color: var(--light-grey); color: var(--black); line-height: 1.6; }
        header { background-color: var(--main-blue); color: var(--white); padding: 1.5rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        .hero { text-align: center; padding: 80px 20px; }
        .hero h2 { font-size: 2.2rem; color: var(--main-blue); margin-bottom: 1rem; }
        .hero p { color: var(--dark-grey); margin-bottom: 2rem; }

        .btn-start { background-color: var(--main-blue); color: white; padding: 15px 40px; border: none; border-radius: 30px; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,91,172,0.3); }

        /* 모달 스타일 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 90%; max-width: 380px; margin: 12% auto; padding: 30px; border-radius: 12px; position: relative; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer; color: #999; }

        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #eee; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: var(--dark-grey); font-weight: 500; }
        .tab.active { color: var(--main-blue); border-bottom: 3px solid var(--main-blue); font-weight: bold; }

        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .btn-submit { width: 100%; padding: 12px; background: var(--main-blue); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        #dashboard { display: none; max-width: 900px; margin: 40px auto; padding: 20px; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .menu-item { background: white; padding: 40px 20px; border-radius: 12px; border: 1px solid #eee; transition: 0.3s; cursor: pointer; }
        .menu-item:hover { border-color: var(--main-blue); transform: translateY(-5px); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .menu-item i { font-size: 2rem; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <h1>TPKR Sales Hub</h1>
</header>

<div id="landing" class="hero">
    <h2>Welcome to TPKR Hub</h2>
    <p>타나베파마 코리아 영업 및 학술 지원 시스템</p>
    <button class="btn-start" onclick="openModal()">시작하기</button>
</div>

<div id="authModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="auth-tabs">
            <div id="tab-login" class="tab active" onclick="switchTab('login')">로그인</div>
            <div id="tab-signup" class="tab" onclick="switchTab('signup')">회원가입</div>
        </div>
        
        <div id="auth-form">
            <input type="email" id="email" placeholder="회사 이메일 (@tanabe-pharma.com)">
            <input type="password" id="password" placeholder="비밀번호">
            <button id="main-btn" class="btn-submit" onclick="handleAuth()">로그인</button>
            <p id="msg" style="font-size: 0.8rem; color: #666; margin-top: 15px; text-align: center;"></p>
        </div>
    </div>
</div>

<div id="dashboard">
    <h2 id="welcome-msg" style="color: var(--main-blue);"></h2>
    <p>원하시는 메뉴를 선택해 주세요.</p>
    <div class="menu-grid">
        <div class="menu-item" onclick="alert('일정 기능을 구현할 예정입니다.')">📅<br><strong>학술 일정</strong></div>
        <div class="menu-item" onclick="alert('자료실 기능을 구현할 예정입니다.')">📚<br><strong>교육 자료</strong></div>
        <div class="menu-item" onclick="alert('참여 관리 기능을 구현할 예정입니다.')">👥<br><strong>참여 관리</strong></div>
    </div>
    <br><br>
    <button onclick="handleSignOut()" style="background:none; border:none; color:var(--dark-grey); text-decoration:underline; cursor:pointer;">로그아웃</button>
</div>

<script>
    // Supabase 주소 고정 (Redirect URL 문제 해결용)
    const REDIRECT_URL = 'https://magnekim.github.io/TPKR-Sales-Hub/';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentMode = 'login';

    function openModal() { document.getElementById('authModal').style.display = 'block'; }
    function closeModal() { document.getElementById('authModal').style.display = 'none'; }

    function switchTab(mode) {
        currentMode = mode;
        document.getElementById('tab-login').className = mode === 'login' ? 'tab active' : 'tab';
        document.getElementById('tab-signup').className = mode === 'signup' ? 'tab active' : 'tab';
        document.getElementById('main-btn').innerText = mode === 'login' ? '로그인' : '인증 메일 전송';
        document.getElementById('password').style.display = mode === 'signup' ? 'none' : 'block';
        document.getElementById('msg').innerText = mode === 'signup' ? '비밀번호 없이 회사 메일 인증만으로 가입됩니다.' : '';
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (currentMode === 'signup') {
            if (!email.endsWith('@tanabe-pharma.com')) {
                alert('회사 이메일(@tanabe-pharma.com)만 가입 가능합니다.');
                return;
            }
            // 매직 링크 발송 및 리다이렉트 주소 명시
            const { error } = await supabaseClient.auth.signInWithOtp({ 
                email,
                options: { emailRedirectTo: REDIRECT_URL } 
            });
            if (error) alert(error.message);
            else alert('인증 메일이 발송되었습니다. 메일함의 링크를 클릭하면 즉시 가입/로그인됩니다.');
        } else {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert('로그인 실패: ' + error.message);
            else showDashboard(data.user);
        }
    }

    function showDashboard(user) {
        document.getElementById('landing').style.display = 'none';
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('welcome-msg').innerText = user.email.split('@')[0] + "님, 반갑습니다!";
    }

    async function handleSignOut() {
        await supabaseClient.auth.signOut();
        location.reload();
    }

    // 로그인 상태 유지 체크
    window.onload = async () => {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) showDashboard(user);
    }
</script>

</body>
</html>
